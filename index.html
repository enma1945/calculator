<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Modern</title>
    <link rel="stylesheet" hres="style.css" />
</head>
<body>
    <main class="calculator" aria-label="Kalkulator Standar">
    <!-- Header -->
    <header class="calc-header">
      <div class="header-left">
        <button class="icon-btn" id="menuBtn" title="Menu Navigasi" aria-label="Menu">≡</button>
        <h1 class="mode-title">Standard</h1>
        <button class="icon-btn mini-btn" id="keepOnTopBtn" title="Keep on Top" aria-label="Keep on Top">⧉</button>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="historyBtn" title="Riwayat Perhitungan" aria-label="History">🕒</button>
      </div>
    </header>
</body>
</html>
